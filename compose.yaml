name: nadeg

services:
  web:
    image: nadeg:local
    build:
      context: .
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      OPENROUTER_RESPONSE_FORMAT: ${OPENROUTER_RESPONSE_FORMAT:-json_schema}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-120}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-6000}
      NADEG_AI_PER_IP_HOUR: ${NADEG_AI_PER_IP_HOUR:-6}
      NADEG_AI_TOTAL_HOUR: ${NADEG_AI_TOTAL_HOUR:-30}
    restart: always
    init: true
    ports:
      - "${NADEG_BIND_IP:-0.0.0.0}:${NADEG_PORT:-80}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
