[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nadeg"
version = "0.4.0"
description = "Учебный комплекс расчёта безотказности и трудоёмкости обслуживания"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "reportlab>=4,<5", "httpx>=0.27,<1", "pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["nadeg*"]

[tool.setuptools.package-data]
nadeg = ["templates/*.html", "static/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
